# Generated by `npm run sync:openapi` in gotenberg.dev from its reference
# data. Don't edit it by hand: change the data, then run the script.
openapi: 3.1.0
info:
  title: Gotenberg
  version: "9"
  summary: A Docker-based API for PDF conversion
  description: "Every operation links to its page of the [documentation](https://gotenberg.dev/docs). The errors answer a status and a plain-text message: see [Errors](https://gotenberg.dev/docs/reference/errors)."
  license:
    name: MIT
    identifier: MIT
externalDocs:
  url: https://gotenberg.dev/docs
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://demo.gotenberg.dev
    description: Demo
security:
  - {}
  - basicAuth: []
  - bearerAuth: []
tags:
  - name: Chromium
  - name: LibreOffice
  - name: PDF
  - name: "PDF: Pages"
  - name: "PDF: Stamps"
  - name: "PDF: Metadata"
  - name: "PDF: Attachments"
  - name: "PDF: Forms"
  - name: "PDF: Text"
  - name: "PDF: Print & size"
  - name: "PDF: Conformance"
  - name: "PDF: Security"
  - name: System
paths:
  /:
    get:
      operationId: root
      summary: Root
      description: "Answers a short note: Gotenberg has no UI."
      tags:
        - System
      externalDocs:
        url: https://gotenberg.dev/docs/system/root
      parameters:
        - $ref: "#/components/parameters/Gotenberg-Trace"
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/baggage"
      responses:
        "200":
          description: "A short HTML note: Gotenberg has no UI."
          headers:
            Gotenberg-Trace:
              $ref: "#/components/headers/Gotenberg-Trace"
            Gotenberg-Version:
              $ref: "#/components/headers/Gotenberg-Version"
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Status401"
  /debug:
    get:
      operationId: debug
      summary: Debug
      description: Answers the modules, engine versions and flags, once `--api-enable-debug-route` is on.
      tags:
        - System
      externalDocs:
        url: https://gotenberg.dev/docs/system/debug
      parameters:
        - $ref: "#/components/parameters/Gotenberg-Trace"
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/baggage"
      responses:
        "200":
          description: "JSON: the modules, the engine versions and every flag. It answers 404 until `--api-enable-debug-route` is on."
          headers:
            Gotenberg-Trace:
              $ref: "#/components/headers/Gotenberg-Trace"
            Gotenberg-Version:
              $ref: "#/components/headers/Gotenberg-Version"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Status401"
  /forms/chromium/convert/html:
    post:
      operationId: chromiumConvertHtml
      summary: Convert HTML to PDF
      description: Prints an HTML file, with the assets beside it, to PDF.
      tags:
        - Chromium
      externalDocs:
        url: https://gotenberg.dev/docs/chromium/convert-html
      parameters:
        - $ref: "#/components/parameters/Gotenberg-Output-Filename"
        - $ref: "#/components/parameters/Gotenberg-Trace"
        - $ref: "#/components/parameters/Gotenberg-Webhook-Url"
        - $ref: "#/components/parameters/Gotenberg-Webhook-Method"
        - $ref: "#/components/parameters/Gotenberg-Webhook-Events-Url"
        - $ref: "#/components/parameters/Gotenberg-Webhook-Extra-Http-Headers"
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/baggage"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                  description: |-
                    `index.html`, and the files it loads: style sheets, images, fonts, scripts. Link each by its name alone, such as `style.css`.

                    Upload under `files` too:

                    - `header.html`: Upload it under `files`: Chromium prints it at the top of each page. Elements with the class `date`, `title`, `url`, `pageNumber` or `totalPages` receive that value. It shares one document with the footer, so give each its own class names.
                    - `footer.html`: The same, at the bottom of each page.
                stages:
                  type: string
                  contentMediaType: application/json
                  description: Stages to run on the PDF, in order, such as `[{"op":"merge"}]`. Upload the files they name under `files`.
                archives:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                  description: "ZIP files Gotenberg unpacks: each entry counts as a file uploaded under `files`."
                downloadFrom:
                  type: string
                  contentMediaType: application/json
                  description: URLs Gotenberg downloads first, as if you had uploaded the files. Each entry takes a `url`, and optionally `extraHttpHeaders` and `filename`.
                waitDelay:
                  type: string
                  description: "Waits this long once the page loads, before printing: `2s`, `500ms`. It must be shorter than `--api-timeout`, or the request answers 400."
                waitForSelector:
                  type: string
                  description: Waits until an element matching this CSS selector is visible, such as `#chart.ready`.
                waitForExpression:
                  type: string
                  description: Waits until this JavaScript expression returns true, such as `window.ready === true`.
                waitForWindowStatus:
                  type: string
                  description: Waits until `window.status` equals this value.
                skipNetworkIdleEvent:
                  type: boolean
                  description: |-
                    Prints without waiting for the network to go idle. `false` waits, for pages that fetch content after they load.

                    Default: `true`.
                  default: true
                skipNetworkAlmostIdleEvent:
                  type: boolean
                  description: |-
                    Prints without waiting for the network to go almost idle. `false` waits.

                    Default: `true`.
                  default: true
                failOnHttpStatusCodes:
                  type: string
                  contentMediaType: application/json
                  description: |-
                    Answers 409 when the page itself answers one of these statuses. `499` stands for 400 to 499, `599` for 500 to 599, and so on for each hundred.

                    Default: `[499,599]`.
                failOnResourceHttpStatusCodes:
                  type: string
                  contentMediaType: application/json
                  description: Answers 409 when a resource the page loads, such as an image or a script, answers one of these statuses. Ranges work as for `failOnHttpStatusCodes`.
                ignoreResourceHttpStatusDomains:
                  type: string
                  contentMediaType: application/json
                  description: 'Domains, subdomains included, that `failOnResourceHttpStatusCodes` leaves out: `["sentry-cdn.com"]`.'
                failOnResourceLoadingFailed:
                  type: boolean
                  description: |-
                    Answers 409 when a resource's load fails on the network: a refused or dropped connection, a host that doesn't resolve, a blocked request. A timeout or a certificate error doesn't count.

                    Default: `false`.
                  default: false
                failOnConsoleExceptions:
                  type: boolean
                  description: |-
                    Answers 409 when the page throws a JavaScript exception.

                    Default: `false`.
                  default: false
                failOnConsoleMessageTypes:
                  type: string
                  contentMediaType: application/json
                  description: "Answers 409 when the page writes one of these console types: `log`, `debug`, `info`, `warning`, `error` or `assert`."
                cookies:
                  type: string
                  contentMediaType: application/json
                  description: "Cookies to set before loading: items with a `name`, a `value` and a `domain`, and optionally a `path`, `secure`, `httpOnly` and `sameSite` (`Strict`, `Lax` or `None`)."
                extraHttpHeaders:
                  type: string
                  contentMediaType: application/json
                  description: 'Headers Chromium sends with the requests the page makes: `{"X-Token": "abc"}`. End a value with `;scope=<regex>` to send it only to the URLs the regex matches. At most 64 headers.'
                userAgent:
                  type: string
                  description: Replaces Chromium's `User-Agent` header.
                emulatedMediaType:
                  type: string
                  description: "The CSS media type the page sees: `screen` or `print`."
                emulatedMediaFeatures:
                  type: string
                  contentMediaType: application/json
                  description: 'CSS media features the page sees: `{"prefers-color-scheme": "dark"}`.'
                omitBackground:
                  type: boolean
                  description: |-
                    Drops the default white background, for a transparent PDF or image. A PDF needs `printBackground` too.

                    Default: `false`.
                  default: false
                paperSize:
                  type: string
                  description: |-
                    `A0`, `A1`, `A2`, `A3`, `A4`, `A5`, `B4`, `B5`, `Letter`, `Legal` or `Tabloid`, in any case. Sets the width and the height.

                    Default: `Letter`.
                paperWidth:
                  type: string
                  description: |-
                    Overrides the width `paperSize` sets. A length is a number in inches, or a number with a unit: `210mm`, `21cm`, `595pt`, `794px`, `50pc`. A negative length answers 400.

                    Default: `8.5in`.
                paperHeight:
                  type: string
                  description: |-
                    Overrides the height `paperSize` sets. A negative length answers 400.

                    Default: `11in`.
                marginTop:
                  type: string
                  description: |-
                    The top margin. The header prints in it. A negative margin answers 400, as for the other margins.

                    Default: `0.39in`.
                marginBottom:
                  type: string
                  description: |-
                    The bottom margin. The footer prints in it.

                    Default: `0.39in`.
                marginLeft:
                  type: string
                  description: |-
                    The left margin.

                    Default: `0.39in`.
                marginRight:
                  type: string
                  description: |-
                    The right margin.

                    Default: `0.39in`.
                landscape:
                  type: boolean
                  description: |-
                    Turns the paper sideways.

                    Default: `false`.
                  default: false
                preferCssPageSize:
                  type: boolean
                  description: |-
                    Uses the size the page's CSS `@page` rule sets, over the paper size.

                    Default: `false`.
                  default: false
                scale:
                  type: number
                  description: |-
                    Scales the rendering, from `0.1` to `2`. A value outside that range answers 400.

                    Default: `1`.
                  default: 1
                printBackground:
                  type: boolean
                  description: |-
                    Prints the page's own background, set on `html` and `body`. Chromium prints the backgrounds of elements, such as table fills and colored boxes, whatever this field says.

                    Default: `false`.
                  default: false
                singlePage:
                  type: boolean
                  description: |-
                    Prints the whole page on one page, as tall as the content.

                    Default: `false`.
                  default: false
                nativePages:
                  type: string
                  description: "Pages to print, in Chromium's syntax: `1-5, 8, 11-13`. A page past the end answers 400. The `select` stage picks pages after printing, and takes `odd`, `even` and `last` too."
                nativeBookmarks:
                  type: boolean
                  description: |-
                    Builds bookmarks from the headings. Implies `nativeTaggedPdf`.

                    Default: `false`.
                  default: false
                nativeTaggedPdf:
                  type: boolean
                  description: |-
                    Writes a tagged PDF, whose structure screen readers follow.

                    Default: `false`.
                  default: false
              required:
                - files
      responses:
        "200":
          description: The PDF. A stage that makes several files, such as `split`, answers a ZIP.
          headers:
            Content-Disposition:
              $ref: "#/components/headers/Content-Disposition"
            Gotenberg-Trace:
              $ref: "#/components/headers/Gotenberg-Trace"
            Gotenberg-Version:
              $ref: "#/components/headers/Gotenberg-Version"
            Gotenberg-Remediation-Residual:
              $ref: "#/components/headers/Gotenberg-Remediation-Residual"
            Gotenberg-Remediation-Rolled-Back:
              $ref: "#/components/headers/Gotenberg-Remediation-Rolled-Back"
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        "204":
          $ref: "#/components/responses/Webhook"
        "400":
          $ref: "#/components/responses/Status400"
        "401":
          $ref: "#/components/responses/Status401"
        "403":
          $ref: "#/components/responses/Status403"
        "409":
          $ref: "#/components/responses/Status409"
        "413":
          $ref: "#/components/responses/Status413"
        "415":
          $ref: "#/components/responses/Status415"
        "429":
          $ref: "#/components/responses/Status429"
        "500":
          $ref: "#/components/responses/Status500"
        "503":
          $ref: "#/components/responses/Status503"
