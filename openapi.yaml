  /forms/libreoffice/convert:
    post:
      operationId: libreofficeConvert
      summary: Convert office documents to PDF
      description: Converts office documents, such as Word, Excel and PowerPoint files, to PDF.
      tags:
        - LibreOffice
      externalDocs:
        url: https://gotenberg.dev/docs/libreoffice/convert
      parameters:
        - $ref: "#/components/parameters/Gotenberg-Output-Filename"
        - $ref: "#/components/parameters/Gotenberg-Trace"
        - $ref: "#/components/parameters/Gotenberg-Webhook-Url"
        - $ref: "#/components/parameters/Gotenberg-Webhook-Method"
        - $ref: "#/components/parameters/Gotenberg-Webhook-Events-Url"
        - $ref: "#/components/parameters/Gotenberg-Webhook-Extra-Http-Headers"
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/baggage"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                  description: The documents. LibreOffice converts the formats listed below, and skips the others.
                stages:
                  type: string
                  contentMediaType: application/json
                  description: Stages to run on the PDF, in order, such as `[{"op":"merge"}]`. Upload the files they name under `files`.
                archives:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                  description: "ZIP files Gotenberg unpacks: each entry counts as a file uploaded under `files`."
                downloadFrom:
                  type: string
                  contentMediaType: application/json
                  description: URLs Gotenberg downloads first, as if you had uploaded the files. Each entry takes a `url`, and optionally `extraHttpHeaders` and `filename`.
                password:
                  type: string
                  description: Opens a password-protected document.
                paperSize:
                  type: string
                  description: "`A0`, `A1`, `A2`, `A3`, `A4`, `A5`, `B4`, `B5`, `Letter`, `Legal` or `Tabloid`, in any case, for every page. Without it, each document keeps its own page size."
                paperWidth:
                  type: string
                  description: "Overrides the width `paperSize` sets. Without `paperSize`, set `paperHeight` too. A length is a number in inches, or a number with a unit: `210mm`, `21cm`, `595pt`, `794px`, `50pc`."
                paperHeight:
                  type: string
                  description: Overrides the height `paperSize` sets. Without `paperSize`, set `paperWidth` too.
                landscape:
                  type: boolean
                  description: |-
                    Turns the pages sideways.

                    Default: `false`.
                  default: false
                nativePages:
                  type: string
                  description: "Pages to export, in LibreOffice's syntax: `1-4`, `2`, `1,3,5-7`. The `select` stage picks pages after the conversion, and takes `odd`, `even` and `last` too."
                singlePage:
                  type: boolean
                  description: |-
                    Puts each sheet of a spreadsheet on one page, hidden sheets included, regardless of its paper size and print ranges.

                    Default: `false`.
                  default: false
                skipEmptyPages:
                  type: boolean
                  description: |-
                    Drops the blank pages a text document inserts on its own.

                    Default: `false`.
                  default: false
                updateIndexes:
                  type: boolean
                  description: |-
                    Updates the tables of contents and the other indexes before the export.

                    Default: `true`.
                  default: true
                exportFormFields:
                  type: boolean
                  description: |-
                    Exports form fields as fields a reader can fill. `false` prints their values only.

                    Default: `true`.
                  default: true
                allowDuplicateFieldNames:
                  type: boolean
                  description: |-
                    Lets several form fields share a name.

                    Default: `false`.
                  default: false
                nativeBookmarks:
                  type: boolean
                  description: |-
                    Exports the document's bookmarks, built from its headings.

                    Default: `true`.
                  default: true
                exportBookmarksToPdfDestination:
                  type: boolean
                  description: |-
                    Also exports the document's own bookmarks, such as Writer bookmarks, as named destinations, which links can target. Headings that build the outline are not bookmarks.

                    Default: `false`.
                  default: false
                exportPlaceholders:
                  type: boolean
                  description: |-
                    Shows the placeholder fields' markings. The exported placeholders do nothing.

                    Default: `false`.
                  default: false
                exportNotes:
                  type: boolean
                  description: |-
                    Exports comments as PDF annotations.

                    Default: `false`.
                  default: false
                exportNotesInMargin:
                  type: boolean
                  description: |-
                    Prints comments in the page margin.

                    Default: `false`.
                  default: false
                exportNotesPages:
                  type: boolean
                  description: |-
                    Adds a presentation's notes pages.

                    Default: `false`.
                  default: false
                exportOnlyNotesPages:
                  type: boolean
                  description: |-
                    Exports the notes pages only, with `exportNotesPages`.

                    Default: `false`.
                  default: false
                exportHiddenSlides:
                  type: boolean
                  description: |-
                    Includes the slides hidden from the slide show.

                    Default: `false`.
                  default: false
                useTransitionEffects:
                  type: boolean
                  description: |-
                    Exports a presentation's slide transitions.

                    Default: `true`.
                  default: true
                convertOooTargetToPdfTarget:
                  type: boolean
                  description: |-
                    Points links to `.odt`, `.ods`, `.odp` and `.odg` files at `.pdf` files of the same name.

                    Default: `false`.
                  default: false
                exportLinksRelativeFsys:
                  type: boolean
                  description: |-
                    Exports `file://` links relative to the document.

                    Default: `false`.
                  default: false
                addOriginalDocumentAsStream:
                  type: boolean
                  description: |-
                    Embeds the document in the PDF, for archiving. LibreOffice re-saves it as ODF and names it `Original.odt`, whatever you uploaded.

                    Default: `false`.
                  default: false
                nativeQuality:
                  type: integer
                  description: |-
                    The JPEG quality of the images, from 1 to 100.

                    Default: `90`.
                  default: 90
                nativeLosslessImageCompression:
                  type: boolean
                  description: |-
                    Compresses images losslessly, instead of as JPEG. Images the document stores as JPEG keep their data. Only images LibreOffice re-encodes, such as with `nativeReduceImageResolution`, become lossless.

                    Default: `false`.
                  default: false
                nativeReduceImageResolution:
                  type: boolean
                  description: |-
                    Downsamples images to `nativeMaxImageResolution`.

                    Default: `false`.
                  default: false
                nativeMaxImageResolution:
                  type: integer
                  description: |-
                    The resolution `nativeReduceImageResolution` downsamples to, in DPI: `75`, `150`, `300`, `600` or `1200`.

                    Default: `300`.
                  default: 300
                nativeWatermarkText:
                  type: string
                  description: Draws this text on every page. Set it or `nativeTiledWatermarkText`, not both.
                nativeWatermarkColor:
                  type: string
                  description: |-
                    The text color, as `#rrggbb`.

                    Default: `#7ffe7f`.
                nativeWatermarkFontSize:
                  type: integer
                  description: The font size, in points. Without it, the text spans the page.
                nativeWatermarkRotation:
                  type: number
                  description: "The angle, in degrees, counter-clockwise: `0` draws the text across the page. Without it, the text runs down a portrait page and across a landscape one."
                nativeWatermarkFont:
                  type: string
                  description: |-
                    The font name.

                    Default: `Helvetica`.
                nativeTiledWatermarkText:
                  type: string
                  description: "Repeats this text across every page, in a grid. Set it or `nativeWatermarkText`, not both: the size, color, font and rotation fields apply to `nativeWatermarkText` only."
                nativePdfa:
                  type: string
                  description: "Exports PDF/A: `PDF/A-1b`, `PDF/A-2b`, `PDF/A-3b` or `PDF/A-4`. The `remediate` stage reaches the other PDF/A levels."
                nativePdfua:
                  type: string
                  description: "Exports PDF/UA: `PDF/UA-1`. With `nativePdfa`, the document needs a title, and `PDF/A-4` answers 400: pair them in `remediate` instead."
                nativeTaggedPdf:
                  type: boolean
                  description: |-
                    Writes a tagged PDF, whose structure screen readers follow, without declaring PDF/UA.

                    Default: `false`.
                  default: false
                initialView:
                  type: string
                  description: |-
                    The side panel a viewer opens: `default`, `outline` or `thumbnails`.

                    Default: `default`.
                initialPage:
                  type: integer
                  description: |-
                    The page a viewer opens at.

                    Default: `1`.
                  default: 1
                magnification:
                  type: string
                  description: |-
                    How a viewer fits the page: `default`, `fitWindow`, `fitWidth`, `fitVisible` or `zoom`.

                    Default: `default`.
                zoom:
                  type: integer
                  description: |-
                    The zoom, in percent, with `magnification` set to `zoom`.

                    Default: `100`.
                  default: 100
                pageLayout:
                  type: string
                  description: |-
                    How a viewer lays the pages out: `default`, `singlePage`, `oneColumn` or `twoColumnRight`, two columns with the first page on the right. LibreOffice can't put it on the left.

                    Default: `default`.
                openBookmarkLevels:
                  type: integer
                  description: |-
                    How many bookmark levels a viewer expands, from 1 to 10. `-1` expands them all.

                    Default: `-1`.
                  default: -1
                resizeWindowToInitialPage:
                  type: boolean
                  description: |-
                    Sizes the viewer's window to the first page shown.

                    Default: `false`.
                  default: false
                centerWindow:
                  type: boolean
                  description: |-
                    Centers the viewer's window on the screen.

                    Default: `false`.
                  default: false
                openInFullScreenMode:
                  type: boolean
                  description: |-
                    Opens the viewer full screen.

                    Default: `false`.
                  default: false
                displayPDFDocumentTitle:
                  type: boolean
                  description: |-
                    Shows the document title, not the file name, in the viewer's title bar. Gotenberg writes it only when the document has a title. A PDF/UA output always shows the title.

                    Default: `true`.
                  default: true
                hideViewerMenubar:
                  type: boolean
                  description: |-
                    Hides the viewer's menu bar.

                    Default: `false`.
                  default: false
                hideViewerToolbar:
                  type: boolean
                  description: |-
                    Hides the viewer's toolbar.

                    Default: `false`.
                  default: false
                hideViewerWindowControls:
                  type: boolean
                  description: |-
                    Hides the viewer's window controls.

                    Default: `false`.
                  default: false
              required:
                - files
      responses:
        "200":
          description: "One PDF per document, named after it: `report.docx` gives `report.docx.pdf`. Several documents answer a ZIP, unless a `merge` stage joins them."
          headers:
            Content-Disposition:
              $ref: "#/components/headers/Content-Disposition"
            Gotenberg-Trace:
              $ref: "#/components/headers/Gotenberg-Trace"
            Gotenberg-Version:
              $ref: "#/components/headers/Gotenberg-Version"
            Gotenberg-Remediation-Residual:
              $ref: "#/components/headers/Gotenberg-Remediation-Residual"
            Gotenberg-Remediation-Rolled-Back:
              $ref: "#/components/headers/Gotenberg-Remediation-Rolled-Back"
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        "204":
