  /forms/pdf/remediate:
    post:
      operationId: pdfRemediate
      summary: Make a PDF conform
      description: "Repairs the PDF until it conforms to a profile, or to a PDF/A profile and a PDF/UA one together. `Gotenberg-Remediation-Residual` counts the violations left: `0` means it conforms."
      tags:
        - "PDF: Conformance"
      externalDocs:
        url: https://gotenberg.dev/docs/pdf/remediate
      parameters:
        - $ref: "#/components/parameters/Gotenberg-Output-Filename"
