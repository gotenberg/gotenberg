        - $ref: "#/components/parameters/Gotenberg-Webhook-Extra-Http-Headers"
        - $ref: "#/components/parameters/traceparent"
        - $ref: "#/components/parameters/baggage"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                  description: The PDFs, and the files the options name.
                archives:
                  type: array
                  items:
                    type: string
                    contentMediaType: application/octet-stream
                  description: "ZIP files Gotenberg unpacks: each entry counts as a file uploaded under `files`."
                downloadFrom:
                  type: string
                  contentMediaType: application/json
                  description: URLs Gotenberg downloads first, as if you had uploaded the files. Each entry takes a `url`, and optionally `extraHttpHeaders` and `filename`.
                profile:
                  type: string
                  description: "`PDF/A-1a`, `PDF/A-1b`, `PDF/A-2a`, `PDF/A-2b`, `PDF/A-2u`, `PDF/A-3a`, `PDF/A-3b`, `PDF/A-3u`, `PDF/A-4`, `PDF/A-4e`, `PDF/A-4f`, `PDF/UA-1`, `PDF/UA-2` or `Factur-X`. A list pairs a PDF/A profile, or `Factur-X`, with the PDF/UA profile of its PDF version: PDF/A-1 to PDF/A-3 with `PDF/UA-1`, PDF/A-4 with `PDF/UA-2`."
                language:
                  type: string
                  description: |-
                    The document's language, as a BCP 47 tag such as `de-DE`.

                    Default: `en`.
                aggressive:
                  type: boolean
                  description: |-
                    Allows fixes that may change how pages look, for better compliance.

                    Default: `false`.
                  default: false
                figureAltText:
                  type: string
                  description: The alternate text for figures that lack one.
                xml:
                  type: string
                  description: "Factur-X only: the uploaded invoice XML to embed. Without it, Factur-X repairs the invoice the PDF already carries."
                level:
                  type: string
                  description: "Factur-X with `xml`, required: `MINIMUM`, `BASIC WL`, `BASIC`, `EN 16931`, `EXTENDED` or `XRECHNUNG`."
                documentType:
                  type: string
                  description: |-
                    Factur-X with `xml`: the document type written in the metadata.

                    Default: `INVOICE`.
                dropSignatures:
                  type: boolean
                  description: |-
                    Removes the signatures of a signed PDF, which this stage rewrites, and keeps their visible appearance on the page. Without it, a signed PDF answers 400.

                    Default: `false`.
                  default: false
              required:
