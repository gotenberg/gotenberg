components:
  parameters:
    Gotenberg-Output-Filename:
      name: Gotenberg-Output-Filename
      in: header
      required: false
      schema:
        type: string
      description: "Names the result, without extension: Gotenberg adds the right one, even to a name that has one, so `report.pdf` gives `report.pdf.pdf`."
    Gotenberg-Trace:
      name: Gotenberg-Trace
      in: header
      required: false
      schema:
        type: string
      description: Your identifier for the request. Gotenberg logs it and sends it back; it makes one up when you don't. `--api-correlation-id-header` renames the header.
    Gotenberg-Webhook-Url:
      name: Gotenberg-Webhook-Url
      in: header
      required: false
      schema:
        type: string
      description: Uploads the result to this URL, an absolute `http` or `https` one, instead of answering with it. Gotenberg answers `204 No Content` right away.
    Gotenberg-Webhook-Method:
      name: Gotenberg-Webhook-Method
      in: header
      required: false
      schema:
        type: string
      description: "The method of the upload: `POST`, the default, `PUT` or `PATCH`."
    Gotenberg-Webhook-Events-Url:
      name: Gotenberg-Webhook-Events-Url
      in: header
      required: false
      schema:
        type: string
      description: "An absolute `http` or `https` URL. Required with `Gotenberg-Webhook-Url`, and the other way round: one without the other answers 400. Receives a `webhook.success` or `webhook.error` event once the work is done."
    Gotenberg-Webhook-Extra-Http-Headers:
      name: Gotenberg-Webhook-Extra-Http-Headers
      in: header
      required: false
      schema:
        type: string
      description: 'A JSON object of headers to send with the upload and the event, such as `{"Authorization": "Bearer …"}`.'
    traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
      description: "W3C Trace Context and Baggage: Gotenberg continues your trace. `OTEL_PROPAGATORS` picks other formats."
    baggage:
      name: baggage
      in: header
      required: false
      schema:
        type: string
      description: "W3C Trace Context and Baggage: Gotenberg continues your trace. `OTEL_PROPAGATORS` picks other formats."
  headers:
    Content-Disposition:
      description: "`attachment` and the file name. A name with characters outside ASCII also carries `filename*=UTF-8''…`, and an ASCII `filename` as a fallback."
      schema:
        type: string
    Gotenberg-Trace:
      description: Your identifier, or the one Gotenberg made up.
      schema:
        type: string
    Gotenberg-Version:
      description: The version of Gotenberg that answered. With [authentication](https://gotenberg.dev/docs/configuration#api-enable-basic-auth) on, the 401, 404 and 405 answers leave it out, so a caller without credentials learns no version.
      schema:
        type: string
    Gotenberg-Remediation-Residual:
      description: "After a `remediate` stage: the violations left, summed over the documents and the profiles. `0` means every document conforms to every profile."
      schema:
        type: string
    Gotenberg-Remediation-Rolled-Back:
      description: "After a `remediate` stage: the fixes Gotenberg undid because they lost pages, text or images. They stay undone with `aggressive` too."
      schema:
        type: string
  responses:
    Webhook:
      description: Uploads the result to this URL, an absolute `http` or `https` one, instead of answering with it. Gotenberg answers `204 No Content` right away.
    Status400:
      description: A form field, a stage or a header is missing or invalid, or a stage failed on a file. The message names it.
      content:
        text/plain:
          schema:
            type: string
    Status401:
      description: The credentials are missing or wrong, with [authentication](https://gotenberg.dev/docs/configuration#api-enable-basic-auth) on.
      content:
        text/plain:
          schema:
            type: string
    Status403:
      description: "The outbound URL filtering blocks a URL: the page Chromium loads, a `downloadFrom` file, a webhook or a timestamp authority. The message stays generic; Gotenberg's logs say why. A host that doesn't resolve answers 400 instead, naming it, except a timestamp authority's."
      content:
        text/plain:
          schema:
            type: string
    Status409:
      description: The page Chromium loaded answered an error status, 4xx or 5xx by default, or failed another [`failOn` check](https://gotenberg.dev/docs/chromium/convert-url#fail-on-errors).
      content:
        text/plain:
          schema:
            type: string
    Status413:
      description: The request is larger than [`--api-body-limit`](https://gotenberg.dev/docs/configuration#api-body-limit) allows.
      content:
        text/plain:
          schema:
            type: string
    Status415:
      description: The request isn't `multipart/form-data`.
      content:
        text/plain:
          schema:
            type: string
    Status422:
      description: "LibreOffice went past [`--libreoffice-max-memory`](https://gotenberg.dev/docs/configuration#libreoffice-max-memory) converting the document. The same document goes past it again: reduce it, or raise the limit."
      content:
        text/plain:
          schema:
            type: string
    Status429:
      description: "The Chromium or LibreOffice queue is full: see [`--chromium-max-queue-size`](https://gotenberg.dev/docs/configuration#chromium-max-queue-size). Retry shortly."
      content:
        text/plain:
          schema:
            type: string
    Status503:
      description: The request took longer than [`--api-timeout`](https://gotenberg.dev/docs/configuration#api-timeout), 30 seconds by default, a Chromium wait included, or Chromium crashed or went past [`--chromium-max-memory`](https://gotenberg.dev/docs/configuration#chromium-max-memory). Retry.
      content:
        text/plain:
          schema:
            type: string
    Status500:
      description: Something else failed, such as an engine crash. Look the request's `Gotenberg-Trace` up in Gotenberg's logs.
      content:
        text/plain:
          schema:
            type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic credentials or an OIDC bearer token, when `--api-enable-basic-auth` or `--api-enable-oidc-auth` is on.
    bearerAuth:
      type: http
      scheme: bearer
      description: Basic credentials or an OIDC bearer token, when `--api-enable-basic-auth` or `--api-enable-oidc-auth` is on.
