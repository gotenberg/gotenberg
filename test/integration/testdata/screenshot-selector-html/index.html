<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Element screenshot</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        background: #ffffff;
      }
      /* A spacer pushes the target away from the origin so the clip has to
         account for the element offset, not just its size. */
      .spacer {
        height: 120px;
      }
      #target {
        width: 300px;
        height: 200px;
        background: #ff0000;
      }
    </style>
  </head>
  <body>
    <div class="spacer"></div>
    <div id="target"></div>
  </body>
</html>
